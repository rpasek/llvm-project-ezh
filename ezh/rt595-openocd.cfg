#===----------------------------------------------------------------------===#
# OpenOCD config for the EZH JTAG test harness (EVK-MIMXRT595, CM33 core)
#===----------------------------------------------------------------------===#
# Serves GDB on localhost:3333 (used by the LLDB ezh-remote test scripts) and
# a telnet console on port 4444. Attach-only: no reset, the board keeps
# running its application.
#
# Usage (from the repo root):
#   openocd -f ezh/rt595-openocd.cfg
#
# On a blank-flash board the SMARTDMA block must be powered up once per power
# cycle before EZH SRAM is writable -- see ezh/README.md. The NXP LinkServer
# gdbserver cannot be used in place of OpenOCD: in attach mode its stub
# rejects GDB memory-write packets.

adapter driver cmsis-dap
transport select swd
adapter speed 4000

# Only needed when more than one debug probe is connected: select by serial,
# e.g.  EZH_ADAPTER_SERIAL=GRA1CQLQ openocd -f ezh/rt595-openocd.cfg
if { [info exists ::env(EZH_ADAPTER_SERIAL)] } {
    adapter serial $::env(EZH_ADAPTER_SERIAL)
}

swd newdap rt595 cpu -expected-id 0x6ba02477
dap create rt595.dap -chain-position rt595.cpu
target create rt595.cm33 cortex_m -dap rt595.dap

# Ports default to 3333/4444 but are env-overridable so a second board can run
# concurrently, e.g. EZH_GDB_PORT=3334 EZH_TELNET_PORT=4445 (two-board I2C test).
set ezh_gdb_port 3333
set ezh_telnet_port 4444
if { [info exists ::env(EZH_GDB_PORT)] }    { set ezh_gdb_port    $::env(EZH_GDB_PORT) }
if { [info exists ::env(EZH_TELNET_PORT)] } { set ezh_telnet_port $::env(EZH_TELNET_PORT) }
gdb_port $ezh_gdb_port
telnet_port $ezh_telnet_port
tcl_port disabled

init
echo "OpenOCD ready: RT595 CM33 attached (no reset)"
